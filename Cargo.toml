[package]
name = "a9-panel"
version = "0.2.0"
edition = "2021"
description = "Native Windows control panel for the ATK A9 Ultimate mouse (unofficial ATK Hub port)"
license = "MIT"

[dependencies]
hidapi = "2"
slint = "1"
tray-icon = "0.26.1"

[build-dependencies]
slint-build = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
