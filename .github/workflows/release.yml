name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release
      - run: cargo build --release
      - name: Publish the .exe on the release page
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $exe = "a9-panel-$env:TAG-windows-x64.exe"
          Copy-Item target/release/a9-panel.exe $exe
          gh release create $env:TAG $exe --title "a9-panel $env:TAG" --generate-notes
